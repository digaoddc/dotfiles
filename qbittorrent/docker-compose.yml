services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=62101
    volumes:
      - ${HOME}/Documents/pessoal/torrent/config:/config
      - ${HOME}/Documents/pessoal/torrent/downloads:/downloads
    ports:
      - 8080:8080
      - 62101:62101
      - 62101:62101/udp
    stop_grace_period: "10s" #optional
    restart: unless-stopped




